databaseChangeLog:
  - changeSet:
      id: create-payments-collection
      author: daria
      changes:
        - createCollection:
            collectionName: payments
            options:
              validator:
                $jsonSchema:
                  bsonType: object
                  required: ["_id", "order_id", "user_id", "status", "timestamp", "payment_amount"]
                  properties:
                    _id:
                      bsonType: binData
                      description: "UUID for idempotency"
                    order_id:
                      bsonType: long
                      description: "Order ID"
                    user_id:
                      bsonType: long
                      description: "User ID"
                    status:
                      enum: ["SUCCESS", "FAILED"]
                      description: "Payment status"
                    timestamp:
                      bsonType: date
                      description: "Payment date and time"
                    payment_amount:
                      bsonType: decimal
                      minimum: 0
                      description: "Payment amount"

  - changeSet:
      id: payments-index-order-id
      author: daria
      changes:
        - createIndex:
            collectionName: payments
            keys:
              order_id: 1
            options:
              name: "idx_order_id_unique"
              unique: true
              background: true

  - changeSet:
      id: payments-index-user-timestamp
      author: daria
      changes:
        - createIndex:
            collectionName: payments
            keys:
              user_id: 1
              timestamp: -1
            options:
              name: "idx_user_timestamp"
              background: true

  - changeSet:
      id: payments-index-status-timestamp
      author: daria
      changes:
        - createIndex:
            collectionName: payments
            keys:
              status: 1
              timestamp: -1
            options:
              name: "idx_status_timestamp"
              background: true